document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

:right\"><a href=\"https://www.neuroquantology.com/media/article_pdfs/264-271.pdf\" target=\"_blank\">NeuroQuantology<\u002Fa><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isWork }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"max-width:1180px;margin:0 auto;padding:64px 56px 0\">\n  <h1 style=\"font-family:'Caprasimo',serif;font-weight:400;font-size:60px;line-height:1;margin:0 0 14px\">Work<\u002Fh1>\n  <p style=\"font-size:19px;color:#645c50;margin:0 0 40px;max-width:56ch\">Five projects across healthcare, finance and consulting. Each one has its own page — the problem, how it's built, and what changed.<\u002Fp>\n  <div style=\"display:flex;flex-direction:column\">\n    <sc-for list=\"{{ projects }}\" as=\"p\" hint-placeholder-count=\"5\">\n      <a href=\"#\" sc-camel-on-click=\"{{ p.open }}\" style=\"display:grid;grid-template-columns:52px 1.4fr 1fr 150px;gap:26px;align-items:baseline;padding:28px 20px;border-radius:20px;border-bottom:1px solid rgba(32,30,29,.14);color:#201e1d\" style-hover=\"background:#ebddc5\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#c67139\">{{ p.num }}<\u002Fspan>\n        <span style=\"font-family:'Caprasimo',serif;font-size:27px;line-height:1.14\">{{ p.title }}<\u002Fspan>\n        <span style=\"font-size:15px;line-height:1.55;color:#645c50\">{{ p.blurb }}<\u002Fspan>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#82796a;text-align:right\">{{ p.org }}<\u002Fspan>\n      <\u002Fa>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isProject }}\" hint-placeholder-val=\"{{ false }}\">\n<article style=\"max-width:1180px;margin:0 auto;padding:44px 56px 0\">\n  <a href=\"#\" sc-camel-on-click=\"{{ goWork }}\" style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#8c491a;display:inline-block;margin-bottom:30px\">← all work<\u002F ight:600;font-size:15px\" style-hover=\"background:#b2622d\">Next project →<\u002Fa>\n    <\u002Faside>\n  <\u002Fdiv>\n<\u002Farticle>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isAbout }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"max-width:1180px;margin:0 auto;padding:64px 56px 0\">\n  <div style=\"display:grid;grid-template-columns:1.5fr 0.5fr;gap:56px;align-items:start\">\n    <div>\n      <h1 style=\"font-family:'Caprasimo',serif;font-weight:400;font-size:60px;line-height:1;margin:0 0 26px\">About me<\u002Fh1>\n      <p style=\"font-size:19.5px;line-height:1.62;color:#474238;margin:0 0 20px;text-wrap:pretty\">I grew up wanting to understand how instruments measure things — that's what took me to instrumentation engineering at NIT Trichy. Somewhere along the way I realized the measurement I cared about was data itself: how it's collected, where it goes wrong, and what it takes to trust a number enough to make a decision on it.<\u002Fp>\n      <p style=\"font-size:19.5px;line-height:1.62;color:#474238;margin:0 0 20px;text-wrap:pretty\">That question has taken me through healthcare analytics at Piramal Pharma, a research lab at Rutgers, consulting work in Texas, and now public health in Los Angeles. The domains change; the work rhymes. Somebody needs an answer, the data is spread across four systems in three shapes, and someone has to build the road between them.<\u002Fp>\n      <p style=\"font-size:19.5px;line-height:1.62;color:#474238;margin:0;text-wrap:pretty\">I like the parts of this job that are quiet and structural — naming things well, making a pipeline fail loudly instead of silently, writing the validation nobody asked for. If you want to talk about Delta Lake, dimensional modeling, or why healthcare code sets are the way they are, I'm easy to reach.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border-radius:28px;overflow:hidden;box-shadow:0 3px 10px rgba(46,43,37,.16)\">\n      <img src=\"7f35e081-3bb1-4ace-bdd1-b480c8d680f5\" alt=\"Pavan Venigalla\ 29,.16);padding-bottom:8px;margin-bottom:22px\">Experience<\u002Fdiv>\n    <sc-for list=\"{{ roles }}\" as=\"r\" hint-placeholder-count=\"4\">\n      <div style=\"margin-bottom:26px\">\n        <div style=\"display:flex;justify-content:space-between;gap:20px;align-items:baseline\"><span style=\"font-size:17.5px;font-weight:700\">{{ r.title }} — {{ r.org }}<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#82796a;white-space:nowrap\">{{ r.period }}<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:10px\">\n          <sc-for list=\"{{ r.bullets }}\" as=\"b\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;gap:12px\"><span style=\"width:6px;height:6px;border-radius:999px;background:#c67139;flex:none;margin-top:8px\"><\u002Fspan><span style=\"font-size:16px;line-height:1.6;color:#474238\">{{ b }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:#8c491a;border-bottom:1px solid rgba(32,30,29,.16);padding-bottom:8px;margin:34px 0 22px\">Skills<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:12px;font-size:16px;line-height:1.5;color:#474238\">\n      <div><strong>Languages<\u002Fstrong> — Python, PySpark, T-SQL, PL/SQL, KQL, R, SQL, JavaScript<\u002Fdiv>\n      <div><strong>Data platforms<\u002Fstrong> — Azure Synapse, GCP BigQuery, SQL Server, MySQL, DynamoDB, Databricks, Microsoft Fabric<\u002Fdiv>\n      <div><strong>Cloud &amp; DevOps<\u002Fstrong> — Azure (ADLS Gen2, Synapse, Fabric, DevOps), GCP, AWS, Docker, Terraform, YAML CI/CD<\u002Fdiv>\n      <div><strong>Architecture<\u002Fstrong> — Medallion, Delta Lake, star schema, dimensional modeling<\u002Fdiv>\n      <div><strong>BI &amp; ML<\u002Fstrong> — Power BI, Tableau, PyTorch, TensorFlow, scikit-learn<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:#8c491a;border-bottom:1px solid rgba(32,30,29,.16);padding-bottom:8px;margin:34px 0 22px\">Education &amp; certifications<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px;font-size:16px;color:#474238\">\n      <div>MS Data Science, Rutgers University — 4.0 GPA (2025)<\u002Fdiv>\n      <div>BE Instrumentation &amp; Control, NIT Tiruchirappalli (2023)<\u002Fdiv>\n      <div>Microsoft DP-700 · AWS Certified AI Practitioner · Google Data Analytics<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isContact }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"max-width:1180px;margin:0 auto;padding:64px 56px 0;display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:start\">\n  <div>\n    <h1 style=\"font-family:'Caprasimo',serif;font-weight:400;font-size:60px;line-height:1;margin:0 0 22px\">Say hello<\u002Fh1>\n    <p style=\"font-size:19.5px;line-height:1.6;color:#474238;margin:0 0 34px;text-wrap:pretty\">Recruiting, a data problem you're stuck on, or just comparing notes on Spark — all welcome. I reply to everything.<\u002Fp>\n    <div style=\"display:flex;flex-direction:column;gap:14px\">\n      <a href=\"mailto:krishvenigalla06@gmail.com\" style=\"display:flex;justify-content:space-between;gap:16px;background:#ebddc5;border-radius:20px;padding:18px 24px;color:#201e1d\" style-hover=\"background:#e1d3b9\"><span style=\"font-weight:600;font-size:16.5px\">Email<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:13.5px;color:#645c50\">krishvenigalla06@gmail.com<\u002Fspan><\u002Fa>\n      <a href=\"https://www.linkedin.com/in/pavan-venigalla/" target=\"_blank\" style=\"display:flex;justify-content:space-between;gap:16px;background:#ebddc5;border-radius:20px;padding:18px 24px;color:#201e1d\" style-hover=\"background:#e1d3b9\"><span style=\"font-weight:600;font-size:16.5px\">LinkedIn<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:13.5px;color:#645c50\">in/pavan-venigalla<\u002Fspan><\u002Fa>\n      <a href=\"https://github.com/pavansatya\" target=\"_blank\" style=\"display:flex;justify-content:space-between;gap:16px;background:#ebddc5;border-radius:20px;padding:18px 24px;color:#201e1d\" style-hover=\"background:#e1d3b9\"><span style=\"font-weight:600;font-size:16.5px\">GitHub<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:13.5px;color:#645c50\">pavansatya<\u002Fspan><\u002Fa>\n      <a href=\"https://www.neuroquantology.com/media/article_pdfs/264-271.pdf\" target=\"_blank\" style=\"display:flex;justify-content:space-between;gap:16px;background:#ebddc5;border-radius:20px;padding:18px 24px;color:#201e1d\" style-hover=\"background:#e1d3b9\"><span style=\"font-weight:600;font-size:16.5px\">Research paper<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:13.5px;color:#645c50\">NeuroQuantology, 2022<\u002Fspan><\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <form sc-camel-on-submit=\"{{ submit }}\" style=\"background:#ebddc5;border-radius:28px;padding:36px\">\n    <sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:34px 8px;text-align:center\">\n        <div style=\"font-family:'Caprasimo',serif;font-size:28px;margin-bottom:10px\">Thanks — that's sent.<\u002Fdiv>\n        <p style=\"font-size:16.5px;color:#474238;margin:0 0 22px\">I'll get back to you within a day or two.<\u002Fp>\n        <a href=\"#\" sc-camel-on-click=\"{{ reset }}\" style=\"font-weight:600;font-size:15px\">Send another<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ notSent }}\" hint-placeholder-val=\"{{ true }}\">\n      <div>\n        <label style=\"display:block;font-size:13.5px;font-weight:600;color:#474238;margin-bottom:8px\">Your name<\u002Flabel>\n        <input value=\"{{ name }}\" sc-camel-on-change=\"{{ setName }}\" placeholder=\"Jane Okafor\" style=\"width:100%;box-sizing:border-box;padding:14px 20px;border-radius:999px;border:1.5px solid #dcd3c4;background:#f9f4ed;font-family:'Figtree',sans-serif;font-size:16px;color:#201e1d;margin-bottom:18px\">\n        <label style=\"display:block;font-size:13.5px;font-weight:600;color:#474238;margin-bottom:8px\">Email<\u002Flabel>\n        <input value=\"{{ email }}\" sc-camel-on-change=\"{{ setEmail }}\" placeholder=\"you@company.com\" style=\"width:100%;box-sizing:border-box;padding:14px 20px;border-radius:999px;border:1.5px solid #dcd3c4;background:#f9f4ed;font-family:'Figtree',sans-serif;font-size:16px;color:#201e1d;margin-bottom:18px\">\n        <label style=\"display:block;font-size:13.5px;font-weight:600;color:#474238;margin-bottom:8px\">Message<\u002Flabel>\n        <textarea value=\"{{ message }}\" sc-camel-on-change=\"{{ setMessage }}\" rows=\"5\" placeholder=\"What's on your mind?\" style=\"width:100%;box-sizing:border-box;padding:16px 20px;border-radius:20px;border:1.5px solid #dcd3c4;background:#f9f4ed;font-family:'Figtree',sans-serif;font-size:16px;color:#201e1d;resize:vertical;margin-bottom:8px\"><\u002Ftextarea>\n        <div style=\"font-size:13.5px;color:#8c491a;min-height:22px;margin-bottom:8px\">{{ error }}<\u002Fdiv>\n        <button type=\"submit\" style=\"width:100%;padding:15px;border:none;border-radius:999px;background:#c67139;color:#f9f4ed;font-family:'Figtree',sans-serif;font-weight:600;font-size:16px;cursor:pointer\" style-hover=\"background:#b2622d\">Send message<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fform>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<footer style=\"max-width:1180px;margin:88px auto 0;padding:32px 56px 44px;border-top:1px solid rgba(32,30,29,.14);display:flex;align-items:baseline;justify-content:space-between;gap:24px;flex-wrap:wrap\">\n  <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#82796a\">Pavan Satya Krishna Venigalla · Los Angeles, CA · 2026<\u002Fspan>\n  <div style=\"display:flex;gap:22px;font-size:14.5px;font-weight:500\">\n    <a href=\"mailto:krishvenigalla06@gmail.com\">Email<\u002Fa>\n    <a href=\"https://www.linkedin.com/in/pavan-venigalla/" target=\"_blank\">LinkedIn<\u002Fa>\n    <a href=\"https://github.com/pavansatya\" target=\"_blank\">GitHub<\u002Fa>\n    <a href=\"https://pavansatya.github.io/pavansatyakrishna.github.io/\" target=\"_blank\">Old site<\u002Fa>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;workLayout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;grid&quot;,&quot;list&quot;],&quot;default&quot;:&quot;grid&quot;,&quot;tsType&quot;:&quot;'grid' | 'list'&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;showSkillRow&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;heroPhoto&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layout&quot;}}\">\nconst PROJECTS = [\n  {\n    num: \"01\", org: \"LA County DHS\", period: \"2025 — present\",\n    title: \"Legacy clinical data, migrated to Azure\",\n    blurb: \"Moving clinical and operational data out of Oracle Millennium HealtheIntent into Azure, with the history intact and the pipeline deployable on a button.\",\n    problem: \"Clinical and operational data lived in Oracle Millennium HealtheIntent, a system that answers the questions it was designed for and not much else. Analysts waited on extracts, historical states were overwritten, and nobody could reproduce last quarter's numbers.\",\n    approach: \"I built ETL/ELT pipelines in PySpark, T-SQL and Azure Synapse following Medallion architecture — raw landing in Bronze, conformed and history-tracked in Silver, star schemas in Gold. SCD-style tracking preserves the state of a record at the time a measure was calculated, and Delta Lake tuning (liquid clustering, Z-order indexing) keeps the Gold layer fast enough to query interactively. Deployment runs through Azure DevOps YAML pipelines across dev, staging and production.\",\n    diagramLabel: \"Medallion pipeline\",\n    stages: [\n      { arrow: \"\", kind: \"source\", name: \"Oracle Millennium HealtheIntent\" },\n      { arrow: \"→\", kind: \"bronze\", name: \"Raw landing — ADLS Gen2\" },\n      { arrow: \"→\", kind: \"silver\", name: \"Conformed + SCD — PySpark, Delta\" },\n      { arrow: \"→\", kind: \"gold\", name: \"Star schemas — Synapse\" },\n      { arrow: \"→\", kind: \"consume\", name: \"Power BI\" }\n    ],\n    outcomes: [\n      \"Historical states are queryable, so quality measures can be recomputed for any point in time.\",\n      \"Delta optimizations cut query time on the Gold layer enough that analysts stopped pre-aggregating by hand.\",\n      \"Releases go through one YAML pipeline instead of manual promotion across environments.\"\n    ],\n    stack: [\"PySpark\", \"T-SQL\", \"Azure Synapse\", \"Delta Lake\", \"ADLS Gen2\", \"Azure DevOps\", \"Power BI\"],\n    role: \"Sole engineer on the migration, working with informatics analysts and clinical stakeholders.\",\n    tags: [\"PySpark\", \"Synapse\", \"Azure DevOps\"]\n  },\n  {\n    num: \"02\", org: \"LA County DHS\", period: \"2025 — present\",\n    title: \"Why a quality measure moved\",\n    blurb: \"A validation and root-cause framework for CBP and CMS quality measures, built on HEDIS, CPT and LOINC code sets.\",\n    problem: \"When a quality measure drops, the first question is whether care changed or the data did. Without validation at each pipeline stage, that question takes days of manual reconciliation to answer — and sometimes never gets answered.\",\n    approach: \"I built data quality validation and UAT frameworks that check pipeline outputs at every layer: row counts, code-set coverage across HEDIS, CPT and LOINC, and measure-level reconciliation against the prior run. When a CBP or CMS metric moves, the framework points at the stage and the code set responsible before anyone opens a spreadsheet.\",\n    diagramLabel: \"Validation flow\",\n    stages: [\n      { arrow: \"\", kind: \"input\", name: \"Pipeline output\" },\n      { arrow: \"→\", kind: \"checks\", name: \"Row + code-set validation\" },\n      { arrow: \"→\", kind: \"compare\", name: \"Run-over-run reconciliation\" },\n      { arrow: \"→\", kind: \"report\", name: \"UAT sign-off dashboard\" }\n    ],\n    outcomes: [\n      \"Root-cause analysis on a measure drop is now a report to read, not an investigation to run.\",\n      \"UAT has a repeatable checklist that analysts and clinicians both sign off on.\",\n      \"Code-set drift is caught at ingest rather than at reporting deadline.\"\n    ],\n    stack: [\"T-SQL\", \"PySpark\", \"HEDIS\", \"CPT\", \"LOINC\", \"Power BI\"],\n    role: \"Designed and implemented the framework; ran UAT with clinical analysts.\",\n    tags: [\"Data quality\", \"HEDIS\", \"UAT\"]\n  },\n  {\n    num: \"03\", org: \"Personal project\", period: \"2024\",\n    title: \"NutriWeb: matching meals to intent\",\n    blurb: \"A dietary recommendation system that reads food descriptions in plain language and ranks options against structured nutrition data.\",\n    problem: \"Nutrition datasets are structured; the way people describe what they eat is not. \\\"Something light with protein, no dairy\\\" doesn't join to a food table.\",\n    approach: \"NutriWeb extracts food entities from free text using NLP, then uses LLM APIs to score and rank candidates against a structured nutrition dataset. The matching layer combines text similarity with nutritional profiling, so a recommendation has to fit both what someone said and what their stated health goals require.\",\n    diagramLabel: \"Recommendation pipeline\",\n    stages: [\n      { arrow: \"\", kind: \"input\", name: \"Free-text request\" },\n      { arrow: \"→\", kind: \"nlp\", name: \"Food entity extraction\" },\n      { arrow: \"→\", kind: \"match\", name: \"Similarity + nutrition profile\" },\n      { arrow: \"→\", kind: \"rank\", name: \"LLM scoring\" },\n      { arrow: \"→\", kind: \"output\", name: \"Ranked meals\" }\n    ],\n    outcomes: [\n      \"Handles vague, conversational requests without a fixed food vocabulary.\",\n      \"Recommendations respect hard dietary constraints instead of treating them as preferences.\",\n      \"Currently being rewritten to run the matching layer in PySpark.\"\n    ],\n    stack: [\"Python\", \"NLP\", \"LLM APIs\", \"scikit-learn\", \"pandas\"],\n    role: \"Solo — design, build and evaluation.\",\n    tags: [\"Python\", \"NLP\", \"scikit-learn\"]\n  },\n  {\n    num: \"04\", org: \"I Net Software Technologies\", period: \"2025\",\n    title: \"Reporting that stopped being rebuilt every week\",\n    blurb: \"ETL pipelines and Power BI dashboards for client stakeholders, with the manual data prep automated out of the loop.\",\n    problem: \"Client reporting depended on manual data preparation — the same cleaning steps in Excel every cycle, done by whoever was available. Turnaround was slow and no two versions of a number quite matched.\",\n    approach: \"I designed and optimized ETL pipelines and data models in SQL and Python to feed reporting directly, then built Power BI dashboards on top for performance tracking and operational KPIs. The preparation steps that used to be done by hand became scheduled jobs.\",\n    diagramLabel: \"Reporting flow\",\n    stages: [\n      { arrow: \"\", kind: \"sources\", name: \"Client systems + Excel\" },\n      { arrow: \"→\", kind: \"etl\", name: \"SQL / Python pipelines\" },\n      { arrow: \"→\", kind: \"model\", name: \"Reporting data model\" },\n      { arrow: \"→\", kind: \"bi\", name: \"Power BI dashboards\" }\n    ],\n    outcomes: [\n      \"Manual data prep dropped out of the reporting cycle entirely.\",\n      \"Stakeholders got KPI dashboards they could self-serve rather than request.\",\n      \"Ad-hoc analysis ran against one agreed model instead of ad-hoc extracts.\"\n    ],\n    stack: [\"SQL\", \"Python\", \"Excel\", \"Power BI\"],\n    role: \"Data engineering intern, working directly with client stakeholders.\",\n    tags: [\"SQL\", \"Python\", \"Power BI\"]\n  },\n  {\n    num: \"05\", org: \"Piramal Pharma\", period: \"2022 — 2023\",\n    title: \"Patient outcome data marts on BigQuery\",\n    blurb: \"Scalable pipelines and dimensional models standardizing operational, patient and treatment data from multiple source systems.\",\n    problem: \"Operational, patient and treatment data arrived from several systems in incompatible shapes. Regulatory reporting and outcome monitoring both needed the same underlying facts, and neither could rely on the other's version.\",\n    approach: \"I built pipelines in GCP BigQuery and Python to process and standardize the incoming datasets, then modeled them into dimensional data marts — one set of conformed dimensions serving analytics, regulatory reporting and patient outcome monitoring. Power BI dashboards on top surfaced treatment trends, therapy adherence and operational KPIs.\",\n    diagramLabel: \"Data mart architecture\",\n    stages: [\n      { arrow: \"\", kind: \"sources\", name: \"Operational · patient · treatment\" },\n      { arrow: \"→\", kind: \"etl\", name: \"BigQuery + Python pipelines\" },\n      { arrow: \"→\", kind: \"model\", name: \"Conformed dimensions\" },\n      { arrow: \"→\", kind: \"marts\", name: \"Analytics + regulatory marts\" },\n      { arrow: \"→\", kind: \"bi\", name: \"Power BI\" }\n    ],\n    outcomes: [\n      \"Regulatory reporting and analytics drew on the same conformed facts.\",\n      \"Therapy adherence and treatment trends became standing dashboards.\",\n      \"New source systems could be added without reshaping downstream models.\"\n    ],\n    stack: [\"GCP BigQuery\", \"Python\", \"SQL\", \"Dimensional modeling\", \"Power BI\"],\n    role: \"Data analyst on the healthcare analytics team.\",\n    tags: [\"BigQuery\", \"Dimensional modeling\", \"Power BI\"]\n  }\n];\n\nconst ROLES = [\n  {\n    period: \"Nov 2025 — present\", title: \"Informatics Data Analyst\", org: \"LA County Department of Health Services\", place: \"Los Angeles, CA\",\n    note: \"Leading the migration of clinical and operational data from Oracle Millennium HealtheIntent into Azure, and building the validation frameworks that keep quality measures explainable.\",\n    bullets: [\n      \"Led end-to-end migration of clinical and operational data from Oracle Millennium HealtheIntent to Azure, developing ETL/ELT pipelines in PySpark, T-SQL and Azure Synapse on Medallion architecture.\",\n      \"Designed SCD-style historical tracking and Delta Lake optimizations (liquid clustering, Z-order indexing); built CI/CD deployment pipelines in Azure DevOps YAML across dev, staging and production.\",\n      \"Developed data quality validation and UAT frameworks; ran root cause analysis on CBP and CMS quality measure drops using HEDIS, CPT and LOINC code sets.\"\n    ]\n  },\n  {\n    period: \"Jun 2025 — Oct 2025\", title: \"Data Engineer Intern\", org: \"I Net Software Technologies\", place: \"Texas, USA\",\n    note: \"Built the pipelines and dashboards behind client reporting, and automated the manual preparation that used to sit in front of it.\",\n    bullets: [\n      \"Designed and optimized ETL pipelines and data models in SQL, Python and Excel for client reporting, dashboarding and ad-hoc analysis.\",\n      \"Built Power BI dashboards for performance tracking and operational KPIs; automated data preparation workflows to cut manual effort and turnaround time.\"\n    ]\n  },\n  {\n    period: \"Jan 2024 — May 2025\", title: \"Research Data Analyst\", org: \"Rutgers University\", place: \"New Jersey, USA\",\n    note: \"Analysis and modeling on large biological datasets alongside my master's, plus forecasting work on lab equipment utilization.\",\n    bullets: [\n      \"Analyzed large biological datasets in SQL and Python; performed statistical analysis, hypothesis testing and regression modeling to support research conclusions.\",\n      \"Built visualizations and analytical summaries; conducted trend analysis and predictive modeling for lab equipment utilization forecasting.\"\n    ]\n  },\n  {\n    period: \"Jun 2022 — Jul 2023\", title: \"Data Analyst, Healthcare Analytics\", org: \"Piramal Pharma\", place: \"Bangalore, India\",\n    note: \"Standardized healthcare data from several source systems into dimensional marts serving analytics, regulatory reporting and outcome monitoring.\",\n    bullets: [\n      \"Developed scalable pipelines in GCP BigQuery and Python to process and standardize healthcare operational, patient and treatment data from multiple sources.\",\n      \"Built dimensional data models and data marts supporting analytics, regulatory reporting and patient outcome monitoring.\",\n      \"Created Power BI dashboards visualizing patient treatment trends, therapy adherence metrics and operational KPIs.\"\n    ]\n  }\n];\n\nconst SKILLS = [\"Python\", \"PySpark\", \"T-SQL\", \"Azure Synapse\", \"Delta Lake\", \"Microsoft Fabric\", \"BigQuery\", \"Databricks\", \"AWS\", \"Terraform\", \"Docker\", \"Power BI\", \"Tableau\", \"scikit-learn\", \"PyTorch\"];\n\nclass Component extends DCLogic {\n  state = { page: \"home\", pi: 0, name: \"\", email: \"\", message: \"\", error: \"\", sent: false };\n\n  go(page, extra) {\n    this.setState(Object.assign({ page: page }, extra || {}));\n    if (typeof window !== \"undefined\") window.scrollTo(0, 0);\n  }\n\n  renderVals() {\n    const s = this.state;\n    const projects = PROJECTS.map((p, i) => Object.assign({}, p, {\n      open: (e) => { if (e) e.preventDefault(); this.go(\"project\", { pi: i }); },\n      next: (e) => { if (e) e.preventDefault(); this.go(\"project\", { pi: (i + 1) % PROJECTS.length }); }\n    }));\n\n    return {\n      projects: projects,\n      roles: ROLES,\n      skills: SKILLS,\n      p: projects[s.pi],\n      homeGrid: s.page === \"home\" && (this.props.workLayout ?? \"grid\") === \"grid\",\n      homeList: s.page === \"home\" && (this.props.workLayout ?? \"grid\") === \"list\",\n      showSkills: this.props.showSkillRow ?? true,\n      heroPhoto: this.props.heroPhoto ?? false,\n      isHome: s.page === \"home\",\n      isWork: s.page === \"work\",\n      isProject: s.page === \"project\",\n      isAbout: s.page === \"about\",\n      isResume: s.page === \"resume\",\n      isContact: s.page === \"contact\",\n      goHome: (e) => { e.preventDefault(); this.go(\"home\"); },\n      goWork: (e) => { e.preventDefault(); this.go(\"work\"); },\n      goAbout: (e) => { e.preventDefault(); this.go(\"about\"); },\n      goResume: (e) => { e.preventDefault(); this.go(\"resume\"); },\n      goContact: (e) => { e.preventDefault(); this.go(\"contact\"); },\n      name: s.name, email: s.email, message: s.message, error: s.error,\n      sent: s.sent, notSent: !s.sent,\n      setName: (e) => this.setState({ name: e.target.value }),\n      setEmail: (e) => this.setState({ email: e.target.value }),\n      setMessage: (e) => this.setState({ message: e.target.value }),\n      reset: (e) => { e.preventDefault(); this.setState({ sent: false, name: \"\", email: \"\", message: \"\", error: \"\" }); },\n      submit: (e) => {\n        e.preventDefault();\n        if (!s.name.trim() || !s.message.trim()) return this.setState({ error: \"A name and a message, and you're set.\" });\n        if (!/^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(s.email)) return this.setState({ error: \"That email doesn't look right.\" });\n        this.setState({ sent: true, error: \"\" });\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
